/* ============================================================
   10 BASE
   ============================================================ */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; }

/* ============================================================

.btn svg { width: 16px; height: 16px; flex: none; }

.badge {

  padding: 2px 8px; border-radius: 999px;

}
.badge--ok { background: var(--ok-soft); color: var(--ok); }

.seg { display: inline-flex; padding: 2px; background: var(--surface-2); border-radius: var(--radius); }

/* ============================================================
   30 TOPBAR
   ============================================================ */
.topbar {

}
.search svg {

}

}

}
.list { view-transition-name: mqlist; }

}

/* ============================================================
   40 NOTICE
   ============================================================ */
.notice {

/* ============================================================
   50 LAYOUT
   ============================================================ */
.layout {

   ============================================================ */

/* ============================================================
   70 RESULTBAR + CHIPS
   ============================================================ */
.resultbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 14px; min-height: 40px;
}

   ============================================================ */
.list--grid {

}

.card:hover { box-shadow: var(--shadow-2); border-color: var(--border-strong); transform: translateY(-1px); }

   100 STATES
   ============================================================ */

<script>
"use strict";
/* ============================================================================
 * MyQNAP Repo 软件浏览器 — 单文件实现
 * 目录：10 UTIL / 20 NORMALIZE / 30 PARSE / 40 DATA / 50 STATE /
 *       60 SELECT / 70 RENDER / 80 SANITIZE / 90 EVENTS / 99 BOOT
 * ========================================================================= */

/* ===== 00 CONFIG ===== */
const CFG = {
  REPO_URL: 'https://myqnap.org/repo.xml',
  SNAPSHOT_URL: 'data/snapshot.json',
  IDB_NAME: 'mqrepo', IDB_VER: 1, IDB_STORE: 'blobs', IDB_KEY: 'repo.xml',
  LS_PREFS: 'mqrepo.prefs.v1',
  LS_META: 'mqrepo.cache.meta.v1',
  LS_ITEMS: 'mqrepo.cache.items.v1',
  BATCH_FIRST: 24,
  BATCH_GRID: 48,
  BATCH_TABLE: 120,
  ROOT_MARGIN: '900px',
  DEBOUNCE_Q: 160,
  CACHE_TTL: 24 * 3600 * 1000,
  SNAPSHOT_WARN_DAYS: 7,
  SNAPSHOT_MAX_DAYS: 30,
  STREAM_ITEMS: 60,
  STREAM_MIN_ITEMS: 12,
  STREAM_FLUSH_MS: 200,
  STREAM_CARDS_MAX: 300,
  CK_NAME: 'mqrepo_sel_v1',
  CK_TTL: 31536000,
  CK_MAX_LEN: 3000,
  SEL_MAX_ARCHS: 12,
  SEL_MAX_MODELS: 40,
  MAX_FILE_BYTES: 20 * 1024 * 1024,
  TYPE_GROUPS: {
    'entertainment': 'Entertainment',
    'entertainment gaming': 'Entertainment',
    'hd entertainement': 'Entertainment',
    'hds5 entertainment': 'Entertainment',
    'quts hero6 -entertainment': 'Entertainment',
    'quts hero6 - hdstation': 'Entertainment',
    'hd games': 'Entertainment',
    'utilities': 'Utilities',
    'hd utils': 'Utilities',
    'developer tools': 'Developer Tools',
    'quts hero6 - dev tools': 'Developer Tools',
    'system administration': 'System Administration',
    'administration': 'System Administration',
    'home automation': 'Home Automation',
    'quts hero6 - automation': 'Home Automation',
    'surveillance': 'Surveillance',
    'cctv': 'Surveillance'
  },
  ARCH_LABEL: {
    x86_64: 'x86_64', arm_64: 'arm_64', 'arm-x41': 'arm-x41',
    'arm-x19': 'arm-x19', 'arm-x31': 'arm-x31',
    x86_32: 'x86 32-bit', unknown: '未标注架构'
  },
  ARCH_ORDER: ['x86_64', 'arm_64', 'arm-x41', 'arm-x19', 'arm-x31', 'x86_32', 'unknown'],
  TAG_ALLOW: ('p div br span hr ul ol li dl dt dd a strong b em i u s del ins code pre blockquote ' +
    'h1 h2 h3 h4 h5 h6 table thead tbody tfoot tr th td caption figure figcaption img small sub sup').split(' '),
  TAG_DROP: ('script style iframe frame frameset object embed applet link meta base form input button ' +
    'select textarea svg math video audio source track canvas template noscript').split(' '),
  ATTR_ALLOW: { a: ['href', 'title'], img: ['src', 'alt', 'width', 'height'], td: ['colspan', 'rowspan'], th: ['colspan', 'rowspan'] },
  HREF_PROTO: ['http:', 'https:', 'mailto:'],
  SRC_PROTO: ['http:', 'https:']
};
const FLAG_META = {
  snapshot: '有截图',
  forum: '有论坛链接',
  download: '有可下载链接'
};
const SORT_LABELS = { date: '更新时间', name: '名称', version: '版本号', devices: '适用设备数', downloads: '安装包数' };

/* ===== 10 UTIL ===== */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function debounce(fn, wait) {
  let t = 0;
  return function () {
    const args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(() => fn.apply(self, args), wait);
  };
}
function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = n => (n < 10 ? '0' + n : '' + n);
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function fmtRelative(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.round(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.round(diff / 3600e3) + ' 小时前';
  return Math.round(diff / 86400e3) + ' 天前';
}
function shortNum(n) {
  if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
  return String(n);
}
function baseName(url) {
  try {
    const p = new URL(url).pathname.split('/');
    return decodeURIComponent(p[p.length - 1] || url);
  } catch (e) { return url.split('/').pop() || url; }
}
/* https 页面里 <img src="http://..."> 会被混合内容策略拦掉；图标/截图统一升到 https。
   万一源站不支持 https 会 404，由捕获阶段的 error 兜底换成字母占位，退化结果与被拦一致。 */
function httpsImg(u) {
  const s = String(u || '').trim();
  return /^http:\/\//i.test(s) ? 'https://' + s.slice(7) : s;
}
function toast(msg, kind) {
  const box = $('#toast');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'err' ? ' toast--err' : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2400);
  setTimeout(() => el.remove(), 2800);
}
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

/* ==== IndexedDB 极简封装 ==== */
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB 不可用'));
    const req = indexedDB.open(CFG.IDB_NAME, CFG.IDB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(CFG.IDB_STORE)) db.createObjectStore(CFG.IDB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB 打开失败'));
  });
}
async function idbSet(key, value) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CFG.IDB_STORE, 'readwrite');
    tx.objectStore(CFG.IDB_STORE).put(value, key);
    tx.oncomplete = () => { db.close(); resolve(true); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(CFG.IDB_STORE, 'readonly');
    const req = tx.objectStore(CFG.IDB_STORE).get(key);
    req.onsuccess = () => { db.close(); resolve(req.result || null); };
    req.onerror = () => { db.close(); reject(req.error); };
  });
}
async function idbDel(key) {
  try {
    const db = await idbOpen();
    await new Promise(resolve => {
      const tx = db.transaction(CFG.IDB_STORE, 'readwrite');
      tx.objectStore(CFG.IDB_STORE).delete(key);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); resolve(); };
    });
  } catch (e) { /* ignore */ }
}

/* ===== 20 NORMALIZE ===== */
function normText(s) {
  return String(s == null ? '' : s)
    .normalize('NFKC')
    .replace(/[\u00a0\u3000]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function typeGroupOf(raw) {
  const key = normText(raw).toLowerCase();
  return CFG.TYPE_GROUPS[key] || normText(raw) || '未分类';
}
/* 18 种写法指向同一个旧 32 位包 */
const LEGACY_32_RE = /OLD|32\s*-?\s*BIT/i;
function normPid(raw) {
  let s = normText(raw);
  if (!s) return { pid: 'UNKNOWN', kind: 'model', arch: 'unknown' };
  const upper = s.toUpperCase().replace(/\s+/g, ' ');
  if (/X86/.test(upper) && LEGACY_32_RE.test(upper)) {
    return { pid: 'X86_32_LEGACY', kind: 'arch', arch: 'x86_32', label: 'x86 32-bit（旧版机型）' };
  }
  let pid = upper.replace(/TS-NAS-?X86/, 'TS-NASX86').replace(/TS-NAS-?ARM-?64/, 'TS-NASARM_64').replace(/\s+/g, '');
  if (pid === 'TS-NASX86') return { pid, kind: 'arch', arch: 'x86_64', label: 'x86_64 通用架构' };
  if (pid === 'TS-NASARM_64') return { pid, kind: 'arch', arch: 'arm_64', label: 'arm_64 通用架构' };
  return { pid, kind: 'model', arch: null };
}
const ARCH_FILE_RE = /_(x86_64|arm_64|arm-x41|arm-x19|arm-x31|x86)\.qpkg(?:$|\?)/i;
function archFromLocation(url) {
  const m = String(url || '').match(ARCH_FILE_RE);
  if (!m) return '';
  const a = m[1].toLowerCase();
  return a === 'x86' ? 'x86_32' : a;
}
function parseVersion(v) {
  const s = normText(v);
  if (!s) return { kind: 2, parts: [], tier: 0, tail: '' };
  const m = s.match(/^v?(\d+(?:\.\d+)*)(.*)$/i);
  if (!m) return { kind: 1, parts: [], tier: 0, tail: s.toLowerCase() };
  const tail = m[2].trim().replace(/^[-_.\s]+/, '').toLowerCase();
  const tier = tail === '' ? 2 : (/^(a|alpha|b|beta|rc|pre|dev|test|snapshot)\b/.test(tail) ? 0 : 1);
  return { kind: 0, parts: m[1].split('.').map(Number), tier, tail };
}
function cmpVersion(a, b) {
  const x = a.vkey, y = b.vkey;
  if (x.kind !== y.kind) return x.kind - y.kind;
  if (x.kind === 2) return 0;
  if (x.kind === 1) return x.tail < y.tail ? -1 : x.tail > y.tail ? 1 : 0;
  const n = Math.max(x.parts.length, y.parts.length);
  for (let i = 0; i < n; i++) {
    const p = x.parts[i] || 0, q = y.parts[i] || 0;
    if (p !== q) return p - q;
  }
  if (x.tier !== y.tier) return x.tier - y.tier;
  return x.tail < y.tail ? -1 : x.tail > y.tail ? 1 : 0;
}
/* 下载链接校验：返回 {ok, reason, external} */
function checkLocation(url) {
  const s = String(url || '').trim();
  if (!s) return { ok: false, reason: '链接为空' };
  let u;
  try { u = new URL(s); } catch (e) { return { ok: false, reason: '不是合法 URL' }; }
  if (!/^https?:$/.test(u.protocol)) return { ok: false, reason: '协议不是 http(s)' };
  if (!/\./.test(u.hostname) || /^(localhost|127\.0\.0\.1|0\.0\.0\.0|example\.com)$/i.test(u.hostname)) {
    return { ok: false, reason: '域名不可用' };
  }
  const external = !/(^|\.)myqnap\.org$/i.test(u.hostname);
  return { ok: true, reason: '', external };
}

/* ===== 30 PARSE ===== */
class RepoError extends Error {
  constructor(code, message, detail) {
    super(message || '解析失败');
    this.name = 'RepoError';
    this.code = code || 'parse';
    this.detail = detail || '';
  }
}
function childText(parent, tag) {
  for (let i = 0; i < parent.children.length; i++) {
    if (parent.children[i].nodeName === tag) return parent.children[i].textContent || '';
  }
  return '';
}
function itemFromElement(el) {
  const platforms = [];
  for (let j = 0; j < el.children.length; j++) {
    const p = el.children[j];
    if (p.nodeName !== 'platform') continue;
    platforms.push({
      pidRaw: normText(childText(p, 'platformID')),
      location: (childText(p, 'location') || '').trim(),
      signature: normText(childText(p, 'signature'))
    });
  }
  return {
    name: normText(childText(el, 'name')) || '(未命名)',
    internalName: normText(childText(el, 'internalName')),
    changeLog: (childText(el, 'changeLog') || '').trim(),
    category: normText(childText(el, 'category')),
    type: normText(childText(el, 'type')),
    icon80: (childText(el, 'icon80') || '').trim(),
    icon100: (childText(el, 'icon100') || '').trim(),
    description: childText(el, 'description') || '',
    version: normText(childText(el, 'version')),
    publishedDate: normText(childText(el, 'publishedDate')),
    maintainer: normText(childText(el, 'maintainer')),
    developer: normText(childText(el, 'developer')),
    forumlink: (childText(el, 'forumlink') || '').trim(),
    language: normText(childText(el, 'language')),
    snapshot: (childText(el, 'snapshot') || '').trim(),
    bannerImg: (childText(el, 'bannerImg') || '').trim(),
    tutorialLink: (childText(el, 'tutorialLink') || '').trim(),
    platforms: platforms
  };
}
function parseRepoXml(text) {
  if (!text || !String(text).trim()) throw new RepoError('empty', '文件内容为空', '选中的文件没有任何内容。');
  let doc;
  try {
    doc = new DOMParser().parseFromString(String(text), 'text/xml');
  } catch (e) {
    throw new RepoError('parse', 'XML 解析失败', String(e && e.message || e));
  }
  const perr = doc.getElementsByTagName('parsererror')[0];
  if (perr) {
    throw new RepoError('parse', 'XML 语法错误', normText(perr.textContent || '').slice(0, 400));
  }
  const root = doc.documentElement;
  if (!root) throw new RepoError('parse', 'XML 为空文档', '没有找到根元素。');
  if (root.nodeName.toLowerCase() !== 'plugins') {
    throw new RepoError('root', '这不是 MyQNAP 仓库文件',
      '根元素应为 <plugins>，实际为 <' + root.nodeName + '>。可能下载到的是网页（HTML）而不是 XML 文件。');
  }

  const cachechk = normText(childText(root, 'cachechk'));
  const rawItems = [];
  for (let i = 0; i < root.children.length; i++) {
    const el = root.children[i];
    if (el.nodeName !== 'item') continue;
    rawItems.push(itemFromElement(el));
  }
  if (!rawItems.length) {
    throw new RepoError('noitems', '仓库中没有任何软件条目',
      'XML 里没有找到 <item> 节点，源站的数据格式可能已经变更，或者这个文件被截断了。');
  }
  return { cachechk: cachechk, items: rawItems };
}

/* ---- 流式切片：只认 </item> 边界（本数据集 6552 段 CDATA 内已确认 0 处出现）----
   不变式：body 以 </item> 结尾、rest 内不含完整 </item>；body 已剥掉 prolog / <plugins> / <cachechk>。 */
function pickCompleteItems(buf) {
  const end = buf.lastIndexOf('</item>');
  if (end < 0) return { body: '', rest: buf, n: 0 };
  const rest = buf.slice(end + 7);
  let body = buf.slice(0, end + 7);
  const head = body.search(/<item[\s>]/);
  if (head < 0) return { body: '', rest: rest, n: 0 };
  body = body.slice(head);
  let n = 0;
  for (let i = body.indexOf('</item>'); i >= 0; i = body.indexOf('</item>', i + 1)) n++;
  return { body: body, rest: rest, n: n };
}
/* 单批解析；任一条目不完整/解析失败 → 返回 null（整批作废，绝不跳批，跳批会静默丢条目） */
function parseItemBatch(body, expect) {
  if (!body) return [];
  let doc;
  try { doc = new DOMParser().parseFromString('<plugins>' + body + '</plugins>', 'text/xml'); }
  catch (e) { return null; }
  if (doc.getElementsByTagName('parsererror')[0]) return null;
  const root = doc.documentElement;
  const out = [];
  for (let i = 0; i < root.children.length; i++) {
    if (root.children[i].nodeName === 'item') out.push(itemFromElement(root.children[i]));
  }
  if (expect != null && out.length !== expect) return null;
  return out;
}

/* ===== 40 NORMALIZE -> DATASET ===== */
function buildDataset(raw, opts) {
  opts = opts || {};
  const rawItems = raw.items || [];
  const idBase = opts.idBase || 0;
  const votes = new Map();      // 归一 pid -> Map(arch -> 次数)
  const parsed = new Array(rawItems.length);

  /* 种子：上次全量跑出的 pidArch 先垫 1 票，真实票叠加其上（同票时种子胜出，避免 1 条离群样本翻盘） */
  if (opts.seed) {
    for (const pid in opts.seed) {
      if (!opts.seed[pid]) continue;
      const m = new Map();
      m.set(opts.seed[pid], 1);
      votes.set(pid, m);
    }
  }

  /* 第一遍：收集平台原始数据，顺带统计每个 pid 的架构投票 */
  for (let i = 0; i < rawItems.length; i++) {
    const r = rawItems[i];
    const plats = [];
    for (let k = 0; k < (r.platforms || []).length; k++) {
      const p = r.platforms[k];
      const np = normPid(p.pidRaw);
      const fileArch = archFromLocation(p.location);
      plats.push({ pid: np.pid, pidRaw: p.pidRaw, kind: np.kind, label: np.label || '', pidArch: np.arch, fileArch: fileArch, location: p.location, signature: p.signature });
      if (fileArch) {
        if (!votes.has(np.pid)) votes.set(np.pid, new Map());
        const m = votes.get(np.pid);
        m.set(fileArch, (m.get(fileArch) || 0) + 1);
      }
    }
    parsed[i] = { r: r, plats: plats };
  }
  const pidProfile = new Map();
  votes.forEach((m, pid) => {
    let best = '', bestN = 0;
    m.forEach((n, a) => { if (n > bestN) { best = a; bestN = n; } });
    pidProfile.set(pid, best);
  });

  /* 第二遍：构建最终数据模型 */
  const items = new Array(rawItems.length);
  for (let i = 0; i < parsed.length; i++) {
    const r = parsed[i].r;
    const plats = parsed[i].plats;
    const seen = new Set();
    const platformIds = [], modelIds = [], archSeen = [];
    const groups = new Map();

    for (let k = 0; k < plats.length; k++) {
      const p = plats[k];
      const arch = p.fileArch || pidProfile.get(p.pid) || p.pidArch || 'unknown';
      p.arch = arch;
      const sig = p.pid + '|' + p.location;
      if (!seen.has(sig)) {
        seen.add(sig);
        if (platformIds.indexOf(p.pid) < 0) platformIds.push(p.pid);
        if (p.kind === 'model' && modelIds.indexOf(p.pid) < 0) modelIds.push(p.pid);
        if (archSeen.indexOf(arch) < 0) archSeen.push(arch);
      }
      let g = groups.get(p.location);
      if (!g) {
        g = { location: p.location, signature: p.signature || '', pids: [], archs: [] };
        groups.set(p.location, g);
      }
      if (!g.signature && p.signature) g.signature = p.signature;
      if (g.pids.indexOf(p.pid) < 0) g.pids.push(p.pid);
      if (g.archs.indexOf(arch) < 0) g.archs.push(arch);
    }

    const dlGroups = [];
    groups.forEach(g => {
      const chk = checkLocation(g.location);
      dlGroups.push({
        location: g.location, signature: g.signature, pids: g.pids, archs: g.archs,
        n: g.pids.length, valid: chk.ok, invalidReason: chk.reason, external: !!chk.external
      });
    });
    dlGroups.sort((a, b) => {
      const ra = rankGroup(a), rb = rankGroup(b);
      if (ra !== rb) return ra - rb;
      if (b.n !== a.n) return b.n - a.n;
      return a.location < b.location ? -1 : 1;
    });

    const descText = htmlToText(r.description);
    const ts = Date.parse((r.publishedDate || '').replace(' ', 'T')) || 0;
    const archSet = archSeen.length ? archSeen.sort((a, b) => CFG.ARCH_ORDER.indexOf(a) - CFG.ARCH_ORDER.indexOf(b)) : ['unknown'];
    const item = {
      id: idBase + i,
      name: r.name,
      internalName: r.internalName,
      typeRaw: r.type,
      typeGroup: typeGroupOf(r.type),
      category: r.category,
      language: r.language,
      version: r.version,
      vkey: parseVersion(r.version),
      dateRaw: r.publishedDate,
      ts: ts,
      year: ts ? new Date(ts).getFullYear() : 0,
      maintainer: r.maintainer,
      developer: r.developer,
      icon: httpsImg(r.icon100 || r.icon80),
      icon80: httpsImg(r.icon80),
      icon100: httpsImg(r.icon100),
      snapshot: httpsImg(r.snapshot),
      bannerImg: httpsImg(r.bannerImg),
      changeLog: r.changeLog,
      forumLink: r.forumlink,
      tutorialLink: r.tutorialLink,
      descRaw: r.description,
      descText: descText,
      summary: makeSummary(descText, 180),
      platforms: plats,
      platformIds: platformIds,
      modelIds: modelIds,
      archSet: archSet,
      downloadGroups: dlGroups,
      hasValidDownload: dlGroups.some(g => g.valid),
      hasSnapshot: !!r.snapshot,
      hasForum: !!r.forumlink,
      descSafe: null
    };
    item.searchText = [
      item.name, item.internalName, item.version, item.typeRaw, item.typeGroup,
      item.maintainer, item.developer, platformIds.join(' '), descText
    ].join(' ').toLowerCase();
    items[i] = item;
  }

  const pidArch = {};
  pidProfile.forEach((v, k) => { if (v) pidArch[k] = v; });
  return { items: items, cachechk: raw.cachechk || '', facets: buildFacets(items), pidArch: pidArch };
}
function rankGroup(g) {
  if (g.pids.indexOf('TS-NASX86') >= 0) return 0;
  if (g.pids.indexOf('TS-NASARM_64') >= 0) return 1;
  return 2;
}

/* ---- 架构/机型选择：cookie + localStorage 双写 ----
   file:// 下 Chrome 会把 document.cookie 静默丢弃（不抛错），只能靠 localStorage 兜底；
   https 下两者都有，用毫秒时间戳裁决谁更新，避免互相覆盖。 */
function readCookie(name) {
  const re = new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)');
  const m = document.cookie.match(re);
  return m ? decodeURIComponent(m[1]) : '';
}
function writeCookie(name, val) {
  try {
    const secure = location.protocol === 'https:' ? '; Secure' : '';
    document.cookie = name + '=' + encodeURIComponent(val) + '; Path=/; Max-Age=' + CFG.CK_TTL + '; SameSite=Lax' + secure;
  } catch (e) { /* ignore */ }
}
function cleanId(v) { return String(v || '').replace(/[^A-Za-z0-9_.\-]/g, '').slice(0, 32); }
function encodeSel(at, archs, models) {
  let a = (archs || []).slice(0, CFG.SEL_MAX_ARCHS).map(cleanId).filter(Boolean);
  let m = (models || []).slice(0, CFG.SEL_MAX_MODELS).map(cleanId).filter(Boolean);
  const build = () => 'v1|at=' + at + '|a=' + a.join(',') + '|m=' + m.join(',');
  let s = build();
  while (s.length > CFG.CK_MAX_LEN && m.length) { m.pop(); s = build(); }
  if (s.length > CFG.CK_MAX_LEN) { m = []; s = 'v1|at=' + at + '|a=' + a.join(',') + '|m='; }
  return s;
}
function parseSel(s) {
  if (!s || s.indexOf('v1|') !== 0) return null;
  const kv = {};
  s.slice(3).split('|').forEach(part => {
    const i = part.indexOf('=');
    if (i < 1) return;
    kv[part.slice(0, i)] = part.slice(i + 1);
  });
  if (!kv.at) return null;
  const list = t => String(t || '').split(',').map(cleanId).filter(Boolean);
  return { at: Number(kv.at) || 0, archs: list(kv.a), models: list(kv.m) };
}
function readSelection(p) {
  p = p || {};
  const lsAt = Number(p.selAt) || 0;
  const lsArchs = Array.isArray(p.archs) ? p.archs.map(cleanId).filter(Boolean) : [];
  const lsModels = Array.isArray(p.models) ? p.models.map(cleanId).filter(Boolean) : [];
  const ck = parseSel(readCookie(CFG.CK_NAME));
  if (ck && ck.at > lsAt) return { at: ck.at, archs: ck.archs, models: ck.models, from: 'cookie' };
  if (lsAt && (lsArchs.length || lsModels.length) && (!ck || ck.at < lsAt)) {
    writeCookie(CFG.CK_NAME, encodeSel(lsAt, lsArchs, lsModels));   // 自愈回写（file:// 下静默失败）
  }
  return { at: lsAt, archs: lsArchs, models: lsModels, from: lsAt ? 'ls' : 'none' };
}
function saveSelection() {
  selAt = Date.now();
  savePrefs();
  writeCookie(CFG.CK_NAME, encodeSel(selAt, Array.from(state.archs), Array.from(state.models)));
}
function pruneSelection() {
  if (!state.facets) return;
  const okA = new Set(state.facets.archs.map(e => e[0]));
  const okM = new Set(state.facets.models.map(e => e[0]));
  let drop = 0;
  state.archs.forEach(v => { if (!okA.has(v)) { state.archs.delete(v); drop++; } });
  state.models.forEach(v => { if (!okM.has(v)) { state.models.delete(v); drop++; } });
  if (!drop) return;
  if (state.models.size) state.modelExpanded = true;
  saveSelection();
  toast('已忽略 ' + drop + ' 个在新数据中不存在的筛选条件');
}

function encodeDataset(raw, source, pidArch, fetchedAt) {
  return {

    cachechk: raw.cachechk || '', count: raw.items.length,
    pidArch: pidArch || null,

}
function decodeDataset(o) {

  if (!Array.isArray(o.items) || !o.items.length) throw new RepoError('schema', '数据集为空');
  return {
    raw: { cachechk: o.cachechk || '', items: o.items.map(fromSnapItem) },
    meta: { fetchedAt: Date.parse(o.generatedAt) || 0, count: o.count || o.items.length, source: o.source || '', cachechk: o.cachechk || '' },
    pidArch: o.pidArch || null

}
async function loadCache() {

    if (rec && rec.v === 1 && rec.items) {
      const d = decodeDataset(rec);
      if (rec.fetchedAt) d.meta.fetchedAt = rec.fetchedAt;
      return d;
    }
    if (rec && rec.text) {   /* 旧版缓存（整份 XML）仍可用 */
      return { raw: parseRepoXml(rec.text), meta: { fetchedAt: rec.fetchedAt || 0, source: rec.source || 'cache', count: rec.count || 0 }, pidArch: null };
    }
  } catch (e) { /* IDB 不可用，走降级 */ }
  try {
    const s = localStorage.getItem(CFG.LS_ITEMS);
    if (s) return decodeDataset(JSON.parse(s));

  return null;
}
async function saveCache(raw, source, pidArch) {
  const now = Date.now();

  let ok = false;
  try {
    await idbSet(CFG.IDB_KEY, Object.assign({}, pack, { fetchedAt: now }));
    ok = true;
  } catch (e) { /* 降到 localStorage */ }
  if (!ok) {
    try {
      const slim = Object.assign({}, pack, {
        items: pack.items.map(it => Object.assign({}, it, { description: String(it.description || '').slice(0, 600) }))
      });
      localStorage.setItem(CFG.LS_ITEMS, JSON.stringify(slim));
      ok = true;
    } catch (e) { /* 容量不足，纯内存运行 */ }
  }
  writeMeta(ok ? { fetchedAt: now, cachechk: pack.cachechk, count: pack.count, source: source } : null);

}

function buildFacets(items) {
  const types = new Map(), archs = new Map(), models = new Map(), maintains = new Map(), years = new Map();
  const flags = { snapshot: 0, forum: 0, download: 0 };
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    types.set(it.typeGroup, (types.get(it.typeGroup) || 0) + 1);
    for (const a of it.archSet) archs.set(a, (archs.get(a) || 0) + 1);
    for (const m of it.modelIds) models.set(m, (models.get(m) || 0) + 1);
    if (it.maintainer) maintains.set(it.maintainer, (maintains.get(it.maintainer) || 0) + 1);
    if (it.year) years.set(String(it.year), (years.get(String(it.year)) || 0) + 1);
    if (it.hasSnapshot) flags.snapshot++;
    if (it.hasForum) flags.forum++;
    if (it.hasValidDownload) flags.download++;
  }
  const byCount = (a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : 1);
  return {
    types: Array.from(types).sort(byCount),
    archs: Array.from(archs).sort((a, b) => CFG.ARCH_ORDER.indexOf(a[0]) - CFG.ARCH_ORDER.indexOf(b[0])),
    models: Array.from(models).sort(byCount),
    maintainers: Array.from(maintains).sort(byCount),
    years: Array.from(years).sort((a, b) => b[0].localeCompare(a[0])),
    flags: flags
  };
}
function queryTokens() {
  return state.q.toLowerCase().split(/\s+/).filter(Boolean);
}
function itemMatches(it, tokens) {
  const { types, archs, models, maintainers, years, flags } = state;
  if (tokens.length) {
    for (let t = 0; t < tokens.length; t++) {
      if (it.searchText.indexOf(tokens[t]) < 0) return false;
    }
  }
  if (types.size && !types.has(it.typeGroup)) return false;
  if (archs.size && models.size) {
    /* 双维度：必须存在「同一个安装包」同时命中架构与机型，
       否则会出现筛出来却下载不了的条目（groupMatches 与下载解析共用）。
       注意：此分支含 valid 校验，与单维度口径略有差异，属预期。 */
    if (!it.downloadGroups.some(g => groupMatches(g, archs, models))) return false;
  } else {
    if (archs.size && !it.archSet.some(a => archs.has(a))) return false;
    if (models.size && !it.modelIds.some(m => models.has(m))) return false;
  }
  if (maintainers.size && !maintainers.has(it.maintainer)) return false;
  if (years.size && !years.has(String(it.year))) return false;
  if (flags.size) {
    if (flags.has('snapshot') && !it.hasSnapshot) return false;
    if (flags.has('forum') && !it.hasForum) return false;
    if (flags.has('download') && !it.hasValidDownload) return false;
  }
  return true;
}
function applyFilters(list) {
  const tokens = queryTokens();
  const src = list || state.items;
  const out = [];
  for (let i = 0; i < src.length; i++) {
    if (itemMatches(src[i], tokens)) out.push(src[i]);
  }
  return out;
}
function sortItems(list) {
  const key = state.sortKey;
  const dir = state.sortDir === 'asc' ? 1 : -1;
  const tail = [];
  let arr = list;
  if (key === 'version') {
    arr = [];
    for (let i = 0; i < list.length; i++) (list[i].vkey.kind === 2 ? tail : arr).push(list[i]);
  } else {
    arr = list.slice();
  }
  const cmpName = (a, b) => a.name.localeCompare(b.name, 'en', { numeric: true, sensitivity: 'base' });
  arr.sort((a, b) => {
    let r = 0;
    if (key === 'version') r = cmpVersion(a, b);
    else if (key === 'name') r = cmpName(a, b);
    else if (key === 'devices') r = a.platformIds.length - b.platformIds.length;
    else if (key === 'downloads') r = a.downloadGroups.length - b.downloadGroups.length;
    else r = a.ts - b.ts;
    if (r !== 0) return r * dir;
    if (a.ts !== b.ts) return b.ts - a.ts;
    const n = cmpName(a, b);
    if (n !== 0) return n;
    return a.id - b.id;
  });
  if (tail.length) {
    tail.sort((a, b) => (b.ts - a.ts) || cmpName(a, b));
    arr = arr.concat(tail);
  }
  return arr;
}

/* ===== 80 SANITIZE ===== */
const ENTITY_MAP = {
  amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', '#39': "'",
  mdash: '—', ndash: '–', hellip: '…', rsquo: '’', lsquo: '‘', ldquo: '“', rdquo: '”',
  copy: '©', reg: '®', trade: '™', deg: '°', middot: '·', bull: '•', times: '×'
};
function decodeEntities(s) {
  return String(s).replace(/&(#[xX][0-9a-fA-F]+|#\d+|[a-zA-Z][a-zA-Z0-9]*);/g, (m, e) => {
    if (e.charAt(0) === '#') {
      const code = (e.charAt(1) === 'x' || e.charAt(1) === 'X') ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10);
      if (!Number.isFinite(code) || code <= 0 || code > 0x10ffff) return m;
      try { return String.fromCodePoint(code); } catch (err) { return m; }
    }
    const v = ENTITY_MAP[e.toLowerCase()];
    return v != null ? v : m;
  });
}
/* 索引期：正则抽纯文本（819 次，避免 DOM 解析开销） */
function htmlToText(html) {
  let s = String(html || '');
  s = s.replace(/<script[\s\S]*?<\/script>/gi, ' ')
    .replace(/<style[\s\S]*?<\/style>/gi, ' ')
    .replace(/<br\s*\/?>/gi, ' ')
    .replace(/<\/(p|div|li|tr|h[1-6]|blockquote|pre|table|section)>/gi, ' ')
    .replace(/<[^>]*>/g, ' ');
  s = decodeEntities(s);
  return normText(s);
}
function makeSummary(text, n) {
  const t = normText(text);
  if (t.length <= n) return t;
  let cut = t.slice(0, n);
  const p = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('。'), cut.lastIndexOf('! '), cut.lastIndexOf('? '), cut.lastIndexOf('；'), cut.lastIndexOf('; '));
  if (p > n * 0.55) cut = cut.slice(0, p + 1);
  return cut.replace(/[\s,;:，；：、]+$/, '') + '…';
}
function safeProtocol(url, allow) {
  const s = String(url || '').trim();
  if (!s) return false;
  if (/^(javascript|data|vbscript|file):/i.test(s)) return false;
  if (/^(#|\/|\.\/|\.\.\/)/.test(s)) return false;
  try {
    const u = new URL(s, location.href);
    return allow.indexOf(u.protocol) >= 0 ? u.href : false;
  } catch (e) { return false; }
}
/* 详情期：白名单重建 DOM（只对真正打开的条目执行，结果缓存） */
function sanitizeHtml(html, doc) {
  const d = doc || document.implementation.createHTMLDocument('desc');
  const src = d.createElement('div');
  src.innerHTML = String(html || '');
  const out = d.createElement('div');
  const walk = (from, to) => {
    const nodes = Array.from(from.childNodes);
    for (const node of nodes) {
      if (node.nodeType === 3) { to.appendChild(d.createTextNode(node.nodeValue)); continue; }
      if (node.nodeType !== 1) continue;
      const tag = node.nodeName.toLowerCase();
      if (CFG.TAG_DROP.indexOf(tag) >= 0) continue;
      if (CFG.TAG_ALLOW.indexOf(tag) < 0) { walk(node, to); continue; }  // 未知标签 unwrap
      const allow = CFG.ATTR_ALLOW[tag] || [];
      const el = d.createElement(tag);
      for (const attr of Array.from(node.attributes)) {
        const name = attr.name.toLowerCase();
        if (allow.indexOf(name) < 0) continue;
        const val = String(attr.value || '');
        if (name === 'href') {
          const href = safeProtocol(val, CFG.HREF_PROTO);
          if (href) el.setAttribute('href', href);
        } else if (name === 'src') {
          const src2 = safeProtocol(val, CFG.SRC_PROTO);
          if (src2) el.setAttribute('src', httpsImg(src2));
        } else if (name === 'width' || name === 'height') {
          const n = parseInt(val, 10);
          if (Number.isFinite(n)) el.setAttribute(name, String(Math.min(480, Math.max(16, n))));
        } else {
          el.setAttribute(name, val);
        }
      }
      if (tag === 'a') {
        if (!el.getAttribute('href')) {
          const span = d.createElement('span');
          while (el.firstChild) span.appendChild(el.firstChild);
          to.appendChild(span);
          continue;
        }
        el.setAttribute('target', '_blank');
        el.setAttribute('rel', 'noopener noreferrer nofollow');
      }
      if (tag === 'img') {
        if (!el.getAttribute('src')) continue;
        el.setAttribute('loading', 'lazy');
        el.setAttribute('decoding', 'async');
        el.setAttribute('referrerpolicy', 'no-referrer');
        el.setAttribute('alt', el.getAttribute('alt') || '');
      }
      to.appendChild(el);
      walk(node, el);
    }
  };
  walk(src, out);
  return out.innerHTML;
}

let listObserver = null;

function iconHtml(it, size) {
  const initial = esc((it.name || '?').trim().charAt(0) || '?');

function hl(text, tokens) {
  const safe = esc(text);
  if (!tokens.length) return safe;
  const t = esc(tokens[0]);
  if (!t) return safe;
  try {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  } catch (e) { return safe; }
}
function summaryFor(it) {

  if (!tokens.length) return it.summary;
  const idx = it.descText.toLowerCase().indexOf(tokens[0]);

}
/* ---- 下载解析：左侧「架构 / 机型」筛选 -> 具体安装包 ---- */
const IS_WECHAT = /MicroMessenger/i.test(navigator.userAgent);
/* 筛选与下载共用同一个谓词，避免「筛出来却下不了」 */
function groupMatches(g, A, M) {
  if (!g.valid) return false;
  if (A && A.size && !g.archs.some(a => A.has(a))) return false;
  if (M && M.size && !g.pids.some(p => M.has(p))) return false;
  return true;
}
function hasDownloadFilter() { return state.archs.size > 0 || state.models.size > 0; }
function groupsFor(it, A, M) {
  A = A || state.archs;
  M = M || state.models;
  const list = it.downloadGroups.filter(g => groupMatches(g, A, M));
  if (list.length < 2) return list;
  const byModel = g => (M.size && g.pids.some(p => M.has(p))) ? 1 : 0;
  return list.slice().sort((a, b) =>
    (byModel(b) - byModel(a)) || (rankGroup(a) - rankGroup(b)) || (b.n - a.n) ||
    (a.location < b.location ? -1 : 1));
}
function resolveDownload(it) {
  if (!hasDownloadFilter()) {
    return { kind: 'need-filter', groups: it.downloadGroups.filter(g => g.valid) };
  }
  const groups = groupsFor(it);
  if (!groups.length) {
    return { kind: 'fallback', groups: it.downloadGroups.filter(g => g.valid) };
  }
  if (groups.length === 1) return { kind: 'single', group: groups[0], groups: groups };
  return { kind: 'multi', group: groups[0], groups: groups };
}
/* 必须由真实 <a> 触发导航，且只允许在用户 click 处理器内同步调用。

let dlWatchDone = false;

      toast('没有开始下载？请允许本站弹出窗口，或用「复制链接」；微信内请用浏览器打开');

function showNotice(text, kind, action) {

const ICON_REFRESH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"></path><path d="M21 3v6h-6"></path></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>';
function setBusy(busy, opts) {
  opts = opts || {};
  const pb = $('#progressbar');
  const btn = $('#btn-refresh');
  const list = $('#list');
  if (pb) {
    pb.hidden = !busy;
    if (busy) {
      const pct = typeof opts.pct === 'number' ? opts.pct : -1;
      if (pct >= 0) {
        pb.dataset.mode = 'determinate';
        pb.style.setProperty('--p', Math.max(2, Math.min(99, Math.round(pct))) + '%');
      } else {
        pb.dataset.mode = 'indeterminate';
        pb.style.removeProperty('--p');
      }
    }
  }
  if (list) list.setAttribute('aria-busy', String(!!busy));
  if (btn) {
    if (state.streaming) {
      btn.innerHTML = ICON_STOP;
      btn.title = '停止加载';
      btn.setAttribute('aria-label', '停止加载');
      btn.classList.remove('is-spinning');
    } else {
      btn.innerHTML = ICON_REFRESH;
      btn.title = '从源站刷新（只更新本机缓存，不改变站内快照）';
      btn.setAttribute('aria-label', '刷新仓库数据');
      btn.classList.toggle('is-spinning', !!busy);
    }
  }
}
function toggleSheet(open) {

    renderFacets();
    if (typeof sheet.showModal === 'function') sheet.showModal();
    else sheet.setAttribute('open', '');

function bindEvents() {
  /* 搜索 */
  const input = $('#search-input');
  const onQ = debounce(v => setQuery(v), CFG.DEBOUNCE_Q);
  input.addEventListener('input', e => {
    const v = e.target.value;
    $('#search-clear').hidden = !v;
    onQ(v);
  });
  $('#search-form').addEventListener('submit', e => {
    e.preventDefault();
    setQuery(input.value);
    input.blur();
  });
  $('#search-clear').addEventListener('click', () => { setQuery(''); input.focus(); });

  /* 工具栏 */
  $('#btn-view-grid').addEventListener('click', () => setView('grid'));
  $('#btn-view-table').addEventListener('click', () => setView('table'));
  $('#btn-theme').addEventListener('click', () => {
    const order = ['auto', 'light', 'dark'];
    setTheme(order[(order.indexOf(state.theme) + 1) % order.length]);

  });

  });

  $('#btn-sortdir').addEventListener('click', () => setSortDir(state.sortDir === 'asc' ? 'desc' : 'asc'));
  $('#sort-select').addEventListener('change', e => {
    const key = e.target.value;
    if (key === 'name') state.sortDir = 'asc';
    else if (state.sortKey === key) { /* 保持 */ }
    else state.sortDir = 'desc';
    state.sortKey = key;
    savePrefs();
    commit();
  });

  /* 筛选面板 */
  $('#btn-filter').addEventListener('click', () => toggleSheet(true));
  $('#sheet-close').addEventListener('click', () => toggleSheet(false));
  $('#sheet-apply').addEventListener('click', () => toggleSheet(false));
  $('#sheet-clear').addEventListener('click', () => { clearFilters(); toggleSheet(false); });

  /* 通知条 */
  $('#notice-close').addEventListener('click', hideNotice);
  $('#notice-action').addEventListener('click', e => {
    const act = e.currentTarget.dataset.noticeAct;
    if (act === 'retry') loadStream({ force: true });
    else if (act === 'import') $('#file-input').click();
    else if (act === 'online') loadStream({ force: true });
  });

  /* 全局委托：点击 */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-copy],[data-remove],[data-sort],[data-more],[data-state-act]');
    if (!el) return;

    if (el.dataset.copy != null) {
      copyText(el.dataset.copy).then(ok => toast(ok ? '链接已复制到剪贴板' : '复制失败，请手动选择复制', ok ? '' : 'err'));
      return;
    }
    if (el.dataset.remove != null) {
      const raw = el.dataset.remove;
      const [key, ...rest] = raw.split('\u0001');
      const value = rest.join('\u0001');
      if (key === 'q') setQuery('');
      else if (state[key] && state[key].has(value)) { toggleFacet(key, value); syncFacetChecks(); }
      return;
    }
    if (el.dataset.sort) { setSort(el.dataset.sort); return; }
    if (el.dataset.more) {
      const which = el.dataset.more;
      if (which === 'types') { state.typeExpanded = !state.typeExpanded; renderFacets(); }
      if (which === 'models') { state.modelExpanded = !state.modelExpanded; renderFacets(); }
      return;
    }
    if (el.dataset.stateAct) {
      const act = el.dataset.stateAct;
      if (act === 'clear') clearFilters();
      else if (act === 'import') $('#file-input').click();
      else if (act === 'retry') loadStream({ force: true });
      return;
    }
    const act = el.dataset.act;
    if (act === 'detail') { openDetail(el.dataset.id || el.closest('[data-id]').dataset.id); }
    else if (act === 'download') {
      /* 带 data-id 的是“未解析”的按钮：先按筛选解析；不带的是详情行内真 <a>，直接放行 */
      if (el.dataset.id != null) handleDownload(Number(el.dataset.id));
      else watchDownload();
    }
    else if (act === 'close-detail') { closeDetail(); }
  });

  /* 全局委托：勾选 / 机型搜索 */
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('input[data-facet]')) {
      toggleFacet(t.dataset.facet, t.value);

  });
  document.addEventListener('input', e => {

  /* 弹层 */

  /* 下载选择层：架构/机型 → 安装包 */
  const picker = $('#picker-dialog');
  if (picker) {
    picker.addEventListener('click', e => {
      if (e.target === picker) { closePicker(); return; }
      /* 架构必须用 click 驱动，不能监听 change（change 不在用户激活列表内，Safari 会拦掉下载） */
      const radio = e.target.closest('input[name="pick-arch"]');

      }
      const t = e.target.closest('[data-pick],[data-pick-model],[data-pick-pkg]');
      if (!t) return;
      if (t.dataset.pick === 'close') { closePicker(); return; }
      if (t.dataset.pick === 'back') {
        pickerState.step = 1;
        pickerState.fromStep1 = true;
        pickerState.groups = null;
        renderPicker();
        return;
      }
      if (t.dataset.pickModel) {

        if (it) pickModel(it, t.dataset.pickModel);
        return;
      }
      if (t.hasAttribute('data-pick-pkg')) { setTimeout(closePicker, 0); return; }
    });
    picker.addEventListener('input', e => {
      const t = e.target;
      if (t.matches('[data-picker-model-search]')) {

  document.addEventListener('keydown', e => {
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
    if (e.key === '/' && !typing) { e.preventDefault(); input.focus(); input.select(); return; }
    if ((e.key === 'k' || e.key === 'K') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); input.focus(); input.select(); return; }
    if (e.key === 'Escape') {
      const openSheet = $('#filter-sheet').open;
      const openDetailEl = $('#detail-dialog').open;
      if (!openSheet && !openDetailEl && state.q) { e.preventDefault(); setQuery(''); }
    }
  });

  /* 拖放导入 */
  const drop = e => {
    e.preventDefault();
    document.body.classList.remove('is-dragover');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) importFile(f);
  };
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('is-dragover'); });
  window.addEventListener('dragleave', e => { if (e.relatedTarget === null) document.body.classList.remove('is-dragover'); });
  window.addEventListener('drop', drop);

  /* 图片加载失败占位（捕获阶段统一处理） */
  document.addEventListener('error', e => {
    const img = e.target;
    if (!img || img.tagName !== 'IMG') return;
    const ph = img.dataset.ph || (img.getAttribute('alt') || '?').charAt(0) || '?';
    const span = document.createElement('span');
    span.className = 'img-fallback' + (img.dataset.size === 'lg' ? ' img-fallback--lg' : '');
    span.textContent = ph.toUpperCase();
    span.setAttribute('aria-hidden', 'true');
    if (img.classList.contains('shot')) {
      span.className = 'state__icon';
      span.textContent = '截图加载失败';
      span.style.width = '100%';
      span.style.height = '120px';
    }
    img.replaceWith(span);
  }, true);
}

/* ===== 42 LOAD / APPLY ===== */
function applyDataset(ds, source, loadedAt) {
  state.items = ds.items;
  state.facets = ds.facets;
  state.cachechk = ds.cachechk || '';
  state.loadedAt = loadedAt || Date.now();
  state.source = source;
  state.phase = 'ready';
  state.error = null;
  state.streaming = false;
  if (ds.pidArch) state.pidArch = ds.pidArch;
  pruneSelection();            /* 必须在 renderFacets 之前：旧 cookie 里的机型可能已不存在 */
  renderFacets();
  commit();
}
function finishTransition(fn) {
  if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); return; }
  try { document.startViewTransition(fn); } catch (e) { fn(); }
}
/* 收尾全量重排时，把用户正在看的那张卡钉在原位（content-visibility 下不能算 delta，只能按元素定位） */
function captureAnchor() {
  const cards = $$('#list .card');
  for (let i = 0; i < cards.length; i++) {
    const r = cards[i].getBoundingClientRect();
    if (r.bottom > 80) return { id: cards[i].dataset.id, offset: r.top };
  }
  return null;
}
function restoreAnchor(a) {
  if (!a) return;
  const el = document.querySelector('#list .card[data-id="' + a.id + '"]');
  if (!el) return;
  const delta = el.getBoundingClientRect().top - a.offset;
  if (Math.abs(delta) > 1) window.scrollBy(0, delta);
}

let streamAbort = null;
let progressRaf = 0;
let facetsTimer = 0;
function streamPct() {
  if (state.bytesTotal > 0) return Math.min(99, Math.round(state.bytes / state.bytesTotal * 100));
  if (state.expected > 0) return Math.min(99, Math.round(state.items.length / state.expected * 100));
  return -1;
}
function updateStreamProgress() {
  if (progressRaf) return;
  progressRaf = requestAnimationFrame(() => {
    progressRaf = 0;
    setBusy(true, { pct: streamPct() });
    renderResultBar();
  });
}
function scheduleFacets() {
  if (facetsTimer) return;
  facetsTimer = setTimeout(() => { facetsTimer = 0; renderFacets(); }, 400);
}
function stopStream() {
  if (streamAbort) { try { streamAbort.abort(); } catch (e) {} streamAbort = null; }
}

/* 流式拉取：边下边切（</item> 边界）边增量归一化边插卡；收尾全量重建一次做排序归位 */
async function loadStream(opts) {
  opts = opts || {};
  stopStream();
  stopObserver();
  streamAbort = new AbortController();
  const signal = streamAbort.signal;

  state.phase = 'loading';
  state.streaming = true;
  state.partial = false;
  state.items = [];
  state.filtered = [];
  state.facets = null;
  state.cachechk = '';
  state.bytes = 0;
  state.bytesTotal = 0;
  state.failedBatches = 0;
  state.expected = opts.expected || state.expected || 0;
  renderSkeleton();
  renderResultBar();
  renderSourceBadge();
  setBusy(true, { pct: -1 });

  const allRaw = [];
  let buf = '';
  let pending = [];
  let lastFlush = performance.now();

  const flush = () => {
    if (!pending.length) return;
    const batchRaw = pending;
    pending = [];
    for (let i = 0; i < batchRaw.length; i++) allRaw.push(batchRaw[i]);
    const ds = buildDataset({ items: batchRaw }, { seed: state.pidArch, idBase: state.items.length });
    state.items = state.items.concat(ds.items);
    state.facets = buildFacets(state.items);
    if (state.streaming) {
      const tokens = queryTokens();
      streamInsert(ds.items.filter(it => itemMatches(it, tokens)));
      renderChips();
      renderResultBar();
      scheduleFacets();
    }
    lastFlush = performance.now();
  };

  try {
    const url = CFG.REPO_URL + (opts.force ? '?_ts=' + Date.now() : '');
    let res;
    try {
      res = await fetch(url, { cache: 'no-store', mode: 'cors', credentials: 'omit', signal: signal });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw new RepoError('network', '无法连接仓库服务器',
        '请求 ' + CFG.REPO_URL + ' 失败：' + (e && e.message ? e.message : 'Failed to fetch') +
        '。可能是网络中断，或被防火墙、代理、广告拦截插件阻断。');
    }
    if (!res.ok) {
      throw new RepoError('http', '仓库服务器返回错误',
        'HTTP ' + res.status + ' ' + (res.statusText || '') + '（' + CFG.REPO_URL + '）');
    }

    if (!res.body || typeof res.body.getReader !== 'function') {
      /* 极老的浏览器没有流式 body：退回一次性解析 */
      const text = await res.text();
      const parsed = parseRepoXml(text);
      const ds = buildDataset(parsed, { seed: null });
      applyDataset(ds, 'remote');
      await saveCache(parsed, 'remote', ds.pidArch);
      hideNotice();
      toast('已载入 ' + ds.items.length + ' 个条目');
      return;
    }

    const enc = (res.headers.get('content-encoding') || 'identity').toLowerCase();
    const len = Number(res.headers.get('content-length')) || 0;
    if (len && enc === 'identity') state.bytesTotal = len;   // br/gzip 下 content-length 是压缩后长度，不能当分母

    const reader = res.body.getReader();
    const dec = new TextDecoder('utf-8');
    for (;;) {
      const chunk = await reader.read();
      if (chunk.value) {
        state.bytes += chunk.value.byteLength;
        buf += dec.decode(chunk.value, { stream: true });
      }
      if (!state.cachechk) {
        const m = buf.match(/<cachechk>(\d+)<\/cachechk>/);
        if (m) state.cachechk = m[1];
      }
      if (buf.indexOf('</item>') >= 0) {
        const cut = pickCompleteItems(buf);
        buf = cut.rest;
        if (cut.n) {
          const batch = parseItemBatch(cut.body, cut.n);
          if (batch) { for (let i = 0; i < batch.length; i++) pending.push(batch[i]); }
          else state.failedBatches++;
        }
      }
      if (pending.length >= CFG.STREAM_ITEMS ||
          (pending.length >= CFG.STREAM_MIN_ITEMS && performance.now() - lastFlush >= CFG.STREAM_FLUSH_MS)) {
        flush();
        updateStreamProgress();
      } else if (state.bytes) {
        updateStreamProgress();
      }
      if (chunk.done) break;
    }
    buf += dec.decode();
    const tail = pickCompleteItems(buf);
    if (tail.n) {
      const batch = parseItemBatch(tail.body, tail.n);
      if (batch) { for (let i = 0; i < batch.length; i++) pending.push(batch[i]); }
      else state.failedBatches++;
    }
    if (pending.length) flush();

    if (state.failedBatches) {
      /* 有整批解析失败：整份文本兜底重解析（不跳批，避免静默丢条目） */
      const text = await fetchRepoText(true);
      const parsed = parseRepoXml(text);
      allRaw.length = 0;
      for (let i = 0; i < parsed.items.length; i++) allRaw.push(parsed.items[i]);
      state.cachechk = parsed.cachechk || state.cachechk;
    }
    if (!allRaw.length) {
      throw new RepoError('noitems', '仓库中没有任何软件条目', '没有从仓库里解析到任何 <item>。');
    }
    const full = buildDataset({ cachechk: state.cachechk, items: allRaw }, { seed: null });
    state.streaming = false;
    const anchor = (window.scrollY || 0) > 8 ? captureAnchor() : null;
    finishTransition(() => {
      applyDataset(full, 'remote');
      restoreAnchor(anchor);
    });
    const ok = await saveCache({ cachechk: state.cachechk, items: allRaw }, 'remote', state.pidArch);
    hideNotice();
    toast('已载入 ' + full.items.length + ' 个条目' + (ok ? '' : '（缓存写入失败，本次会话有效）'));
  } catch (err) {
    state.streaming = false;
    const aborted = !!(err && err.name === 'AbortError');
    if (allRaw.length) {
      const partial = buildDataset({ cachechk: state.cachechk, items: allRaw }, { seed: state.pidArch });
      state.partial = true;
      state.phase = 'ready';
      state.items = partial.items;
      state.facets = partial.facets;
      if (partial.pidArch) state.pidArch = partial.pidArch;
      renderFacets();
      commit();
      renderSourceBadge();
      showNotice(aborted
        ? '已停止加载，当前 ' + partial.items.length + ' 条（继续加载会从头重新拉取）'
        : '载入中断，已显示 ' + partial.items.length + ' 条：' + (err.message || '网络异常'),
        aborted ? 'info' : 'warn',
        { label: aborted ? '继续加载' : '重试', act: 'retry' });
      if (!aborted) toast('载入中断：' + (err.message || '网络异常'), 'err');
      return;
    }
    state.phase = 'error';
    state.error = {
      title: (err && err.message) || '无法获取仓库数据',
      desc: (err && err.detail) || '请检查网络连接后重试，或导入本地 repo.xml 文件离线浏览。',
      detail: err && err.code ? '错误代码：' + err.code : '',
      actions: [{ id: 'retry', label: '重试', primary: true }, { id: 'import', label: '导入本地 repo.xml' }]
    };
    renderAll();
    renderSourceBadge();
  } finally {
    setBusy(false);
  }
}
async function importFile(file) {
  try {
    const text = await readLocalFile(file);
    const raw = parseRepoXml(text);
    const ds = buildDataset(raw, { seed: null });
    applyDataset(ds, 'file');
    const ok = await saveCache(raw, 'file', ds.pidArch);
    showNotice('已导入 ' + file.name + '：' + ds.items.length + ' 个条目' + (ok ? '，已缓存（下次打开直接可用）' : '，缓存写入失败（容量不足，本次会话有效）'),
      'ok', { label: '恢复在线数据', act: 'online' });
  } catch (err) {
    toast((err && err.message) || '导入失败', 'err');
    if (!state.items.length) {
      state.phase = 'error';
      state.error = {
        title: (err && err.message) || '导入失败',
        desc: (err && err.detail) || '请确认选择的是 myqnap.org 的 repo.xml 文件。',
        detail: err && err.code ? '错误代码：' + err.code : '',
        actions: [{ id: 'import', label: '重新选择文件', primary: true }, { id: 'retry', label: '改为在线加载' }]
      };
      renderAll();
    } else {
      const dt = err && err.detail ? '（' + String(err.detail).slice(0, 160) + '）' : '';
      showNotice('导入失败：' + (err.message || '未知错误') + dt + '。已保留当前数据。', 'error', { label: '重试导入', act: 'import' });
    }
  }
}

/* ===== 99 BOOT ===== */
async function init() {
  setTheme(state.theme);
  document.body.dataset.view = state.view;
  $('#btn-view-grid').classList.toggle('is-on', state.view === 'grid');
  $('#btn-view-table').classList.toggle('is-on', state.view === 'table');
  bindEvents();
  setBusy(true, { pct: -1 });
  renderSkeleton();
  renderResultBar();
  renderSourceBadge();

  let cached = null;
  try { cached = await loadCache(); } catch (e) { cached = null; }
  const fresh = cached && (Date.now() - (cached.meta.fetchedAt || 0) < CFG.CACHE_TTL);

  /* 1) 新鲜缓存（0 网络，最快） */
  if (fresh) {
    try {
      const ds = buildDataset(cached.raw, { seed: cached.pidArch });
      const src = (cached.meta && cached.meta.source === 'file') ? 'file' : 'cache';
      applyDataset(ds, src, (cached.meta && cached.meta.fetchedAt) || Date.now());
      renderSourceBadge();
      setBusy(false);
      if (src === 'file') {
        showNotice('正在浏览本地导入的文件（' + state.items.length + ' 个条目）。需要最新数据可点右侧按钮。', 'ok',
          { label: '恢复在线数据', act: 'online' });
      }
      return;
    } catch (err) {
      await clearCache();
      cached = null;
      toast('缓存数据已损坏，已自动清除，正在重新加载');
    }
  }

  /* 2) 站点快照（同源，首访快通道） */
  const snap = await loadSnapshot();
  if (snap) {
    try {
      const ds = buildDataset(snap.raw, { seed: snap.pidArch });
      applyDataset(ds, 'snapshot', snap.meta.fetchedAt || Date.now());
      state.snapshotAt = snap.meta.fetchedAt || 0;
      state.expected = ds.items.length;
      renderSourceBadge();
      setBusy(false);
      const age = Date.now() - (state.snapshotAt || 0);
      if (age > CFG.SNAPSHOT_WARN_DAYS * 86400000) {
        const days = Math.round(age / 86400000);
        showNotice('内置数据生成于 ' + days + ' 天前，可能缺少新上架软件。点右侧按钮从源站刷新。',
          age > CFG.SNAPSHOT_MAX_DAYS * 86400000 ? 'error' : 'warn',
          { label: '刷新', act: 'retry' });
      }
      saveCache(snap.raw, 'snapshot', ds.pidArch);
      return;
    } catch (err) {
      console.warn('[snapshot] 应用失败', err);
    }
  }

  /* 3) 过期缓存兜底（先给用户看到东西，再提示刷新） */
  if (cached) {
    try {
      const ds = buildDataset(cached.raw, { seed: cached.pidArch });
      applyDataset(ds, 'cache', cached.meta.fetchedAt || Date.now());
      renderSourceBadge();
      setBusy(false);
      showNotice('正在使用 ' + fmtRelative(state.loadedAt) + '的缓存数据，点右侧按钮获取最新。', 'warn',
        { label: '刷新', act: 'retry' });
      return;
    } catch (err) { /* fallthrough */ }
  }

  /* 4) 直连源站（流式） */
  await loadStream({});
}

document.addEventListener('DOMContentLoaded', init);

</script>
