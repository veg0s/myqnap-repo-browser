name: snapshot

# 每 24 小时抓一次 myqnap.org，重新生成快照并整站覆盖部署到 GitHub Pages。
# UTC 19:00 = 北京时间次日 03:00（源站在欧洲时区，这个点基本是它的低谷）。
#
# 刻意不把快照提交进仓库：旧版本的安装包链接本来就已经失效，留历史没有意义，
# 而 2.7 MB 的快照每天提交一次会把仓库撑大。所以这里用「Actions 产物部署」——
# 每次部署都是一次性产物，仓库里只保留几百字节的检查时间（顺便让定时任务不被停用）。
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write     # 提交那几百字节的 status
  pages: write        # 部署 Pages
  id-token: write     # deploy-pages 需要 OIDC

# Pages 部署固定用 pages 组，避免两次部署互相踩
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成快照（每次覆盖，不留历史）
        # --force：即使内容与仓库里的基线一致也重写，保证发布产物里的 generatedAt 是本次时间
        # --strict：自检（条目数/链接后缀/重复项）不通过就非零退出，绝不发布半截数据
        # --retries 3：Cloudflare 偶发 52x / 连接重置时自动重试
        run: python tools/build_snapshot.py --self-check --strict --force --retries 3

      - name: 组装站点
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/
          cp data/snapshot.json data/snapshot.status.json _site/data/
          : > _site/.nojekyll
          echo "待发布文件："
          find _site -type f -printf '  %p  %s bytes\n' | sort

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行时自动开启 Pages，省得先去 Settings 点一遍。
          # 若 Pages 已经是「分支直发」，需要手动把 Source 改成 GitHub Actions，否则 deploy-pages 会报源不匹配。
          enablement: true

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4

      - name: 记录检查时间
        # 只提交几百字节的 status：既能给页面提供「上次检查」时间，
        # 也让仓库保持每天有提交，避免 GitHub 在 60 天无活动后自动停用定时任务。
        # 状态文件是「最新一次覆盖即可」的语义，所以被别的运行抢先时不做 merge/rebase，
        # 而是以远端为基准重放自己的版本（rebase 同一个文件必然冲突）。
        run: |
          set -u
          git add data/snapshot.status.json
          if git diff --cached --quiet; then
            echo "status 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG="chore(snapshot): 检查于 $(date -u +%Y-%m-%dT%H:%MZ)"
          git commit -q -m "$MSG"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "第 $attempt 次推送被拒，改用远端最新提交重放"
            cp data/snapshot.status.json /tmp/snapshot.status.json
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp /tmp/snapshot.status.json data/snapshot.status.json
            git add data/snapshot.status.json
            git commit -q -m "$MSG" || exit 0
            sleep 5
          done
          echo "::error::status 提交连续 3 次被拒（部署已完成，不影响站点）"
          exit 1
